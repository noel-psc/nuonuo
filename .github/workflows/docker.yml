name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 构建平台；ACR 个人版若不支持多架构，改成 linux/amd64
        required: false
        default: linux/amd64,linux/arm64

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      ghcr_image: ${{ steps.vars.outputs.ghcr_image }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算镜像地址
        id: vars
        run: |
          # GHCR 只接受小写仓库名；镜像名与仓库名保持一致，避免两个 registry 路径分叉
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "ghcr_image=$image" >> "$GITHUB_OUTPUT"
          echo "image_name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      # fork PR 拿不到 secrets；同仓库 PR 也不需要推送，跳过避免无谓注入
      - name: 检查并规范化 ACR 配置
        id: acr
        if: github.event_name != 'pull_request'
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          # 允许 ACR_REGISTRY 误写成 https://xxx/ 的形式
          registry="${ACR_REGISTRY#*://}"
          registry="${registry%/}"
          namespace="${ACR_NAMESPACE%%/*}"
          if [ -n "$registry" ] && [ -n "$namespace" ] \
             && [ -n "$ACR_USERNAME" ] && [ -n "$ACR_PASSWORD" ]; then
            {
              echo "enabled=true"
              echo "registry=$registry"
              echo "namespace=$namespace"
            } >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ACR 凭据，本次只推送到 GHCR"
          fi

      - name: 设置 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录阿里云 ACR
        if: github.event_name != 'pull_request' && steps.acr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.ghcr_image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=nuonuo
            org.opencontainers.image.description=诺诺 - NoneBot2 QQ 机器人（内置 SUES 校园账单插件）

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # GitHub(美国) → 阿里云(上海) 公网链路在百 MB 级上传时会被边缘节点重置
      # （HTTP/2 PROTOCOL_ERROR），重试也无法续传。这里失败不阻塞整体流水线：
      # GHCR 镜像可用，ACR 用 deploy/sync-acr.sh 在国内机器同步。
      - name: 同步镜像到阿里云 ACR（仅 amd64，失败不阻塞）
        # 默认关闭：跨境链路不可用时每次会白等 30 分钟。
        # 配好国内 self-hosted runner 后，在仓库 Variables 里设 ACR_SYNC_IN_CI=true 再开。
        if: github.event_name != 'pull_request' && steps.acr.outputs.enabled == 'true' && vars.ACR_SYNC_IN_CI == 'true'
        timeout-minutes: 40
        continue-on-error: true
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ${{ steps.vars.outputs.image_name }}
          ACR_REGISTRY: ${{ steps.acr.outputs.registry }}
          ACR_NAMESPACE: ${{ steps.acr.outputs.namespace }}
        run: |
          set -euo pipefail

          # 部署机是 x86：只搬 linux/amd64 子镜像，搬运量从 ~540MB 降到 ~270MB。
          # 跨境大流量上传偶发 HTTP/2 PROTOCOL_ERROR（对端重置流），重试即可续传：
          # blob 是内容寻址的，已传完的层会被跳过。
          copy_one() {
            local src="$1" dst="$2" repo digest attempt
            repo="${src%:*}"
            digest=$(docker buildx imagetools inspect --raw "$src" 2>/dev/null \
              | jq -r '.manifests[]? | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest' 2>/dev/null \
              | head -1) || true

            for attempt in 1 2 3; do
              echo "::group::[尝试 ${attempt}/3] ${src} -> ${dst}（amd64=${digest:-single-arch}）"
              if [ -n "${digest:-}" ] && [ "$digest" != "null" ]; then
                docker buildx imagetools create --tag "$dst" "${repo}@${digest}" && { echo "::endgroup::"; return 0; }
              else
                docker buildx imagetools create --tag "$dst" "$src" && { echo "::endgroup::"; return 0; }
              fi
              echo "::endgroup::"
              echo "第 ${attempt} 次失败，$((attempt * 20))s 后重试（已传层会跳过）"
              sleep $((attempt * 20))
            done
            echo "::error::${src} 同步到 ACR 失败（重试 3 次）"
            return 1
          }

          echo "$TAGS" | while IFS= read -r src; do
            [ -z "$src" ] && continue
            tag="${src##*:}"
            copy_one "$src" "${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:${tag}"
          done

  smoke:
    name: 镜像冒烟测试
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) 依赖冒烟：能 import 说明 ddddocr/onnxruntime/libgomp 等运行期依赖齐全
      - name: 依赖冒烟（加载插件）
        env:
          IMAGE: ${{ needs.build.outputs.ghcr_image }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e DRIVER=~fastapi+~httpx+~websockets \
            "$IMAGE" \
            python -c "import nonebot; nonebot.init(); nonebot.load_plugin('nonebot_plugin_sues_bill'); print('sues plugin loaded ok')"

      # 2) 启动冒烟：验证入口、非 root 用户、端口与 /healthz
      - name: 启动冒烟（探活 /healthz）
        env:
          IMAGE: ${{ needs.build.outputs.ghcr_image }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name nuonuo-smoke \
            -e DRIVER=~fastapi+~httpx+~websockets \
            -e HOST=0.0.0.0 \
            -e PORT=8080 \
            -p 18080:8080 \
            "$IMAGE"

          trap 'docker logs nuonuo-smoke; docker rm -f nuonuo-smoke' EXIT

          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              ok="1"
              break
            fi
            sleep 1
          done

          if [ -z "$ok" ]; then
            echo "::error::容器 30 秒内未通过 /healthz 探活"
            exit 1
          fi

          # 先落盘再 grep：pipefail 下 `docker logs | grep -q` 会因 SIGPIPE 返回 141 而误判
          docker logs nuonuo-smoke > /tmp/smoke.log 2>&1 || true
          grep -q 'Succeeded to load plugin "nonebot_plugin_sues_bill"' /tmp/smoke.log \
            || { echo "::error::插件未成功加载"; tail -50 /tmp/smoke.log; exit 1; }

          echo "启动冒烟通过"
