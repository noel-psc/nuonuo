[project]
name = "nuonuo"
version = "0.1.0"
description = "诺诺 —— 基于 NoneBot2 的 QQ 机器人"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
  "nonebot2[fastapi]>=2.5.0,<3.0.0",
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "nonebot-adapter-qq>=1.7.1,<2.0.0",
  "nonebot-plugin-sues-bill>=1.2.0,<2.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.15.2,<1.0.0",
]

# 本仓库是应用而不是可分发库：不要尝试构建/安装自身
[tool.uv]
package = false

# ── 以下为 nb-cli 标准项目配置：nb run / nb plugin install 都会读写这里 ──
[tool.nonebot]
plugin_dirs = ["src/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
"~onebot.v11" = [
  { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
"~qq" = [
  { name = "QQ", module_name = "nonebot.adapters.qq" },
]
"@local" = []

[tool.nonebot.plugins]
"@store" = ["nonebot_plugin_sues_bill"]
"@local" = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "B", "SIM"]
ignore = ["E402"]  # nonebot require() 与懒加载要求导入在初始化之后
